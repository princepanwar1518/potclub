# Builds the PotClub Android and iOS apps on GitHub's machines.
#
# Always (every push to main, every PR, manual runs):
#   - web checks (lint, types, tests, build)
#   - Android debug APK  -> artifact "potclub-android-debug" (install on any Android phone)
#   - iOS simulator build -> proves the Xcode project compiles (no Apple account needed)
#
# Release builds run on a tag like v1.0.0, or manually with "release: true", and only when the
# matching secrets exist. Missing secrets skip those steps; they never fail the run.
#   Android (signed .aab for Play + signed .apk):
#     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   iOS (archive, sign and upload to TestFlight using an App Store Connect API key):
#     APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64
# See mobile/README.md for how to create each one.

name: Mobile apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Build signed release apps and upload iOS to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build:native
      - uses: actions/upload-artifact@v4
        with: { name: web-native, path: dist-native, retention-days: 3 }

  android:
    needs: web
    runs-on: ubuntu-latest
    env:
      POTCLUB_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: web-native, path: dist-native }
      - run: npx cap sync android

      - name: Debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: potclub-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Release signing key
        id: keystore
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set; skipping signed Android build."
            echo "present=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "present=true" >> "$GITHUB_OUTPUT"
      - name: Signed AAB + APK
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        env:
          POTCLUB_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          POTCLUB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          POTCLUB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          POTCLUB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease
      - if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: potclub-android-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  ios:
    needs: web
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: web-native, path: dist-native }
      - run: npx cap sync ios

      - name: Simulator build (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: App Store Connect key
        id: asc
        if: env.IS_RELEASE == 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "$ASC_KEY_ID" ]; then
            echo "::notice::App Store Connect API key not set; skipping signed iOS build."
            echo "present=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "present=true" >> "$GITHUB_OUTPUT"

      # Automatic ("cloud-managed") signing via the API key: Xcode creates or reuses the distribution
      # certificate and App Store profile itself, so no .p12 or profile files are needed.
      - name: Archive, sign and upload to TestFlight
        if: steps.asc.outputs.present == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PotClub.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" archive | tail -n 40
          sed "s/__TEAM_ID__/$TEAM_ID/" mobile/ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PotClub.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 40
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
