<path d="M190 588 C300 636 700 636 810 588" stroke="#FFFFFF" stroke-width="7" fill="none" opacity=".8" filter="url(#soft)"/>
<path d="M230 600 C340 632 450 640 520 640" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity=".95"/>
<path d="M760 610 C800 596 830 580 846 560" stroke="#3FF2FF" stroke-width="6" fill="none" opacity=".75" filter="url(#soft)"/>
<!-- paws + tongue over the rim -->
<ellipse cx="300" cy="640" rx="80" ry="16" fill="#000" opacity=".45" filter="url(#soft)"/>
<ellipse cx="700" cy="640" rx="80" ry="16" fill="#000" opacity=".45" filter="url(#soft)"/>
<g filter="url(#shortFur)"><path d="M228 600 C228 556 250 536 300 536 C350 536 372 556 372 598 C372 628 350 640 300 640 C250 640 228 628 228 600 Z" fill="url(#pawFur)"/><path d="M628 600 C628 556 650 536 700 536 C750 536 772 556 772 598 C772 628 750 640 700 640 C650 640 628 628 628 600 Z" fill="url(#pawFur)"/></g>
<path d="M274 606 Q276 622 274 636" stroke="#3A1A06" stroke-width="5" stroke-linecap="round" fill="none" opacity=".75"/><path d="M300 606 Q302 622 300 636" stroke="#3A1A06" stroke-width="5" stroke-linecap="round" fill="none" opacity=".75"/><path d="M326 606 Q328 622 326 636" stroke="#3A1A06" stroke-width="5" stroke-linecap="round" fill="none" opacity=".75"/><path d="M674 606 Q676 622 674 636" stroke="#3A1A06" stroke-width="5" stroke-linecap="round" fill="none" opacity=".75"/><path d="M700 606 Q702 622 700 636" stroke="#3A1A06" stroke-width="5" stroke-linecap="round" fill="none" opacity=".75"/><path d="M726 606 Q728 622 726 636" stroke="#3A1A06" stroke-width="5" stroke-linecap="round" fill="none" opacity=".75"/>
