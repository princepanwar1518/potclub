  <ellipse cx="500" cy="600" rx="230" ry="60" fill="#000" opacity=".55" filter="url(#blur18)"/>
  <ellipse cx="500" cy="330" rx="300" ry="230" fill="url(#potGlow)" opacity=".55" filter="url(#blur40)"/>
  <g filter="url(#furTex)"><path d="M368 262 C262 236 212 338 222 470 C230 566 268 626 318 618 C362 610 372 530 380 420 Z" fill="url(#earFur)"/><path d="M632 262 C738 236 788 338 778 470 C770 566 732 626 682 618 C638 610 628 530 620 420 Z" fill="url(#earFur)"/></g>
  <path d="M322 640 C302 430 352 214 500 210 C648 214 698 430 678 640 Z" fill="#120500" opacity=".75" filter="url(#blur18)"/>
  <g filter="url(#furTex)"><path d="M322 640 C302 430 352 214 500 210 C648 214 698 430 678 640 Z" fill="url(#fur)"/></g>
  <path d="M650 300 C694 380 694 500 680 620" stroke="#3FF2FF" stroke-width="14" fill="none" opacity=".3" filter="url(#blur18)"/>
  <path d="M760 330 C790 420 788 520 766 590" stroke="#3FF2FF" stroke-width="12" fill="none" opacity=".3" filter="url(#blur18)"/>
  <path d="M360 240 C330 300 320 380 324 460" stroke="#FFD9A8" stroke-width="12" fill="none" opacity=".35" filter="url(#soft)"/>
  
  <!-- face -->
  <path d="M470 222 C478 300 522 300 530 222 C516 214 484 214 470 222 Z" fill="#E7B47D" opacity=".55" filter="url(#soft)"/>
  <ellipse cx="500" cy="470" rx="118" ry="86" fill="url(#muzzle)" filter="url(#shortFur)"/>
  <ellipse cx="380" cy="430" rx="34" ry="20" fill="#FF6F95" opacity=".28" filter="url(#soft)"/>
  <ellipse cx="620" cy="430" rx="34" ry="20" fill="#FF6F95" opacity=".28" filter="url(#soft)"/>
  <g>
    <path d="M384 352 Q428 318 470 346" stroke="#2A1203" stroke-width="10" fill="none" stroke-linecap="round" opacity=".55" filter="url(#soft)"/>
    <path d="M616 352 Q572 318 530 346" stroke="#2A1203" stroke-width="10" fill="none" stroke-linecap="round" opacity=".55" filter="url(#soft)"/>
    <ellipse cx="428" cy="378" rx="34" ry="37" fill="#1A0A02"/>
    <ellipse cx="572" cy="378" rx="34" ry="37" fill="#1A0A02"/>
    <circle cx="428" cy="380" r="28" fill="url(#iris)"/>
    <circle cx="572" cy="380" r="28" fill="url(#iris)"/>
    <circle cx="430" cy="383" r="13" fill="#050200"/>
    <circle cx="574" cy="383" r="13" fill="#050200"/>
    <ellipse cx="417" cy="366" rx="10" ry="8" fill="#FFFFFF"/>
    <ellipse cx="561" cy="366" rx="10" ry="8" fill="#FFFFFF"/>
    <circle cx="440" cy="394" r="3.5" fill="#FFFFFF" opacity=".85"/>
    <circle cx="584" cy="394" r="3.5" fill="#FFFFFF" opacity=".85"/>
    
  </g>
  <path d="M460 438 C458 410 542 410 540 438 C538 470 514 484 500 484 C486 484 462 470 460 438 Z" fill="url(#noseGloss)"/>
  <ellipse cx="486" cy="425" rx="15" ry="7" fill="#FFFFFF" opacity=".75" filter="url(#soft)" transform="rotate(-12 486 425)"/>
  <ellipse cx="486" cy="425" rx="7" ry="3" fill="#FFFFFF" opacity=".9"/>
  <ellipse cx="485" cy="456" rx="7" ry="4.5" fill="#000" transform="rotate(20 485 456)"/><ellipse cx="515" cy="456" rx="7" ry="4.5" fill="#000" transform="rotate(-20 515 456)"/>
  <path d="M500 484 V506" stroke="#2A1203" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="500" cy="522" rx="52" ry="24" fill="#5A0A1E"/>
  <path d="M436 504 Q470 548 500 512 Q530 548 564 504" stroke="#2A1203" stroke-width="6" fill="none" stroke-linecap="round"/>

</g>
